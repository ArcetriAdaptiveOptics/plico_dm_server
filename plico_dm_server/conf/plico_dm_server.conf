
[deviceAnotherSimulatedDM]
name= Another Simulated DM 
model= simulatedDM
serial_number= 234
default_flat_tag= zero

[deviceOurSimulatedDM]
name= Our Simulated DM 
model= simulatedDM
serial_number= 1
default_flat_tag= zero

[deviceALPAO277]
name= ALPAO DM 277
model= alpaoDM
serial_number= BAX181
lib_folder= 'C:\Program Files\Alpa\SDK\Samples\Python\Lib64'
default_flat_tag= alpao277zero

[devicePiTipTilt]
name= PIS334 tip-tilt DM (static open-loop; NOT the PWFS modulator path)
model= piTipTilt
serial_number= 110032051
ip_address= 192.168.30.190

[deviceSimulatedModulator]
name= Simulated PWFS Modulator
model= simulatedModulator

[devicePiS334Modulator]
name= PI S334 PWFS Modulator (E-518.I3)
model= piS334Modulator
serial_number= 110032051
ip_address= 192.168.30.190

# Lab BMC Multi-DM 5.5 µm (USB Multi Driver). Placeholder SN until lab install.
# Runner accepts model=bmc and model=bmcMultiDM (alias).
# Leave default_flat_tag unset until a 140-act MultiDM flat is calibrated.
[deviceBmc]
name= BMC Multi-DM 5.5um Prima
model= bmcMultiDM
serial_number= XXXXXXX

# Laptop / sim path for Drop 2 (140 actuators, same command vector as real BMC)
# No default_flat_tag: the shared "zero" calib is 36-act; leave tag unset so the
# controller builds a matching zero reference from getNumberOfActuators().
[deviceSimulatedBmcMultiDM]
name= Simulated BMC Multi-DM 140
model= simulatedMEMS140
serial_number= BMC-SIM-140
n_actuators= 140

[deviceMaedowlarkSLM]
name= Meadowlark SLM 1920
model= meadowlarkSLM
blink_dir_root= C:\Program Files\Meadowlark Optics\Blink OverDrive Plus
lut_filename= C:\Users\labot\Desktop\SLM\slm6208_at635_PCIe.LUT
wfc_filename= C:\Users\labot\Desktop\SLM\slm6208_at635_WFC.bmp
wl_calibration= 635e-9
default_flat_tag=zero_slm

[dm1]
name= Deformable Mirror Server 1
log_level= info
mirror= deviceOurSimulatedDM
host= localhost
port= 7000

[dm2]
name= Deformable Mirror Server 2
log_level= info
mirror= deviceAnotherSimulatedDM
host= localhost
port= 7010

# Drop 2 — BMC Multi-DM (sim by default; swap mirror= deviceBmc for lab USB)
[dmBmc]
name= Prima BMC Multi-DM Server
log_level= info
mirror= deviceSimulatedBmcMultiDM
host= localhost
port= 7050

# Phase-1 PWFS modulator server (use processMonitor server_config_prefix=modulator
# or start: plico_dm_server <conf> modulator1)
[modulator1]
name= PWFS Modulator Server
log_level= info
modulator= deviceSimulatedModulator
host= localhost
port= 7030

# Lab bench: change modulator1.modulator to devicePiS334Modulator
# and set devicePiS334Modulator.ip_address / serial_number for the E-518.

[processMonitor]
name= Monitor plico_dm processes
spawn_delay= 1
host= localhost
port= 7020
# For modulator-only bring-up, set: server_config_prefix= modulator


[global]
app_name= inaf.arcetri.ao.plico_dm_server
app_author= INAF Arcetri Adaptive Optics
python_package_name=plico_dm_server
